name: Release

# release-please keeps a release PR open with the next version and CHANGELOG entry.
# Merging that PR creates the tag and GitHub Release; the job below then builds the
# installer and attaches it, with latest.yml for auto-update (ADR 0011).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # release-please acts as the tScore Release GitHub App, not the built-in workflow token.
      # GitHub never starts workflows from the built-in token's pushes, so the release PR's
      # required checks would never run. Until the app's client id (repository variable
      # RELEASE_APP_CLIENT_ID) and key (secret RELEASE_APP_PRIVATE_KEY) exist, it falls back to the
      # built-in token. Setup: docs/maintainers/release-app.md.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist
      # Code signing goes here once the certificate is set up (SignPath / Azure Trusted Signing).
      - name: Attach installer to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd apps/desktop/release
          gh release upload "$TAG" tScore-Setup-*.exe tScore-Setup-*.exe.blockmap latest.yml --clobber
