name: Release

# release-please keeps a release PR open with the next version and CHANGELOG entry.
# Merging that PR creates the tag and GitHub Release; the job below then builds the
# installer and attaches it, with latest.yml for auto-update (ADR 0011).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # release-please acts as the tScore Release GitHub App, not the built-in workflow token.
      # GitHub never starts workflows from the built-in token's pushes, so the release PR's
      # required checks would never run. Until the app's client id (repository variable
      # RELEASE_APP_CLIENT_ID) and key (secret RELEASE_APP_PRIVATE_KEY) exist, it falls back to the
      # built-in token. Setup: docs/maintainers/release-app.md.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build the installer
        shell: bash
        run: |
          if [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then
            # Signed releases: installed copies accept an update only from the same publisher
            # (SignPath Foundation signs on behalf of open-source projects). This goes into the
            # app's update settings, so it must be in this first build.
            cd apps/desktop
            npx electron-vite build
            npx electron-builder --win --x64 --publish never               -c.win.signtoolOptions.publisherName="${{ vars.SIGNPATH_PUBLISHER || 'SignPath Foundation' }}"
          else
            npm run dist
          fi

      # Code signing through SignPath Foundation (docs/maintainers/code-signing.md). Off until
      # the repository variable SIGNPATH_ORGANIZATION_ID is set; releases are then unsigned, as
      # before. The private key never leaves SignPath: GitHub sends the files, SignPath signs
      # them. Two passes: the app itself, then the installer rebuilt around the signed app.
      - name: Upload the app for signing
        id: app-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: apps/desktop/release/win-unpacked/tScore.exe
          if-no-files-found: error
      - name: Sign the app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tScore' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
      - name: Rebuild the installer around the signed app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          cp signed-app/tScore.exe apps/desktop/release/win-unpacked/tScore.exe
          rm -f apps/desktop/release/tScore-Setup-*
          cd apps/desktop
          npx electron-builder --win --x64 --prepackaged release/win-unpacked --publish never
      - name: Upload the installer for signing
        id: installer-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: apps/desktop/release/tScore-Setup-*.exe
          if-no-files-found: error
      - name: Sign the installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tScore' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - name: Use the signed installer, and refresh the update information
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          cp signed-installer/tScore-Setup-*.exe apps/desktop/release/
          node scripts/refresh-update-info.mjs apps/desktop/release
      - name: Check both are signed
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($f in @('apps/desktop/release/win-unpacked/tScore.exe') + (Get-ChildItem apps/desktop/release/tScore-Setup-*.exe).FullName) {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed: $($s.Status)" }
            Write-Host "$f signed by $($s.SignerCertificate.Subject)"
          }

      - name: Attach installer to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd apps/desktop/release
          gh release upload "$TAG" tScore-Setup-*.exe tScore-Setup-*.exe.blockmap latest.yml --clobber

      - name: Attach the Test trial kit to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          node scripts/build-test-trial.mjs dist-kit
          gh release upload "$TAG" dist-kit/tScore-Test-Trial-*.zip --clobber
