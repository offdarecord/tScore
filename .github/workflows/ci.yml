name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated schema types and validators are up to date
        run: npm run check:schemas
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: App end-to-end
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Launch the app and click through it (Playwright, axe accessibility check)
        run: npm run test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 14

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: tScore-installer-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
          retention-days: 14
          if-no-files-found: error
