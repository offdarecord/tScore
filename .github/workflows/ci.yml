name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated schema types and validators are up to date
        run: npm run check:schemas
      - name: The results credit's logo is up to date
        run: npm run check:credit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: No high or critical vulnerabilities in any library (npm audit)
        run: npm run check:audit
      - name: Electron is still a version that gets security fixes
        run: npm run check:electron

  e2e:
    name: App end-to-end
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Launch the app and click through it (Playwright, axe accessibility check)
        run: npm run test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 14

  # macOS (#61, beta in 0.8.0): the tests run on a Mac so nothing Windows-only creeps in, and the
  # Mac app is packaged. Free on public repositories. Required checks on main.
  macos-test:
    name: macOS unit tests
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  macos-e2e:
    name: macOS app end-to-end
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Launch the app and click through it (Playwright, axe accessibility check)
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: The Mac app packages (Apple silicon, not a .dmg)
        run: npx electron-builder --mac dir --arm64 --publish never
        working-directory: apps/desktop
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-macos-${{ github.sha }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 14

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: tScore-installer-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
          retention-days: 14
          if-no-files-found: error
